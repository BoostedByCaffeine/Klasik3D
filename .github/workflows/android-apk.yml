name: Build Klasik 3D Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install web dependencies & build offline APK bundle
        env:
          VITE_APP_PLATFORM: apk
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx vite build --base=./

      - name: Generate Capacitor Android Project & Compile Landscape Fullscreen APK
        run: |
          npm install --save --legacy-peer-deps --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android
          node scripts/patch-android-capacitor.mjs
          node scripts/generate-icons.mjs --android-res android/app/src/main/res
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('android/app/src/main/AndroidManifest.xml'); ET.parse('android/app/src/main/res/values/styles.xml'); ET.parse('android/app/src/main/res/values/ic_launcher_background.xml'); print('Android XML validation passed')"
          npx cap sync android
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          fi
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Klasik3D.apk

      - name: Upload Klasik3D.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klasik3D-Android-APK
          path: ./Klasik3D.apk
          if-no-files-found: error
