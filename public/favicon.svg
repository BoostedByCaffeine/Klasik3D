<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="platIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="45%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="#09090B" />

  <!-- Automotive Pill Crest -->
  <rect x="6" y="14" width="52" height="36" rx="18" fill="#111114" stroke="url(#platIcon)" stroke-width="2.6" />
  <rect x="10.5" y="18.5" width="43" height="27" rx="13.5" fill="none" stroke="#52525B" stroke-width="1" />

  <!-- 3-Spoke Steering Wheel / Vinyl Ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="url(#platIcon)" stroke-width="2.6" />
  <line x1="21" y1="32" x2="26.5" y2="32" stroke="#E4E4E7" stroke-width="2.2" stroke-linecap="round" />
  <line x1="37.5" y1="32" x2="43" y2="32" stroke="#E4E4E7" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="37.5" x2="32" y2="43" stroke="#E4E4E7" stroke-width="2.2" stroke-linecap="round" />

  <!-- Coffee Bean Hub -->
  <g transform="translate(32, 32) rotate(-22)">
    <ellipse cx="0" cy="0" rx="4.2" ry="6" fill="#FFFFFF" stroke="#09090B" stroke-width="1" />
    <path d="M0 -5 C1.5 -2, -1.5 2, 0 5" fill="none" stroke="#09090B" stroke-width="1.3" stroke-linecap="round" />
  </g>
</svg>
