<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 116" width="480" height="116">
  <defs>
    <!-- Crisp White-to-Silver Wordmark Gradient -->
    <linearGradient id="whiteSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <!-- Brushed Platinum Metallic Gradient -->
    <linearGradient id="platinumBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="22%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#94A3B8" />
      <stop offset="72%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Platinum Rim Stroke -->
    <linearGradient id="platinumRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Subtle Brushed Metal Micro-Grain Pattern -->
    <pattern id="brushedLines" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.7" opacity="0.22" />
      <line x1="3" y1="0" x2="3" y2="6" stroke="#09090B" stroke-width="0.6" opacity="0.14" />
    </pattern>

    <!-- Subtle Platinum Edge Glow -->
    <filter id="platGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Stealth Automotive / Kissaten Pill Crest -->
  <g transform="translate(10, 22)">
    <!-- Outer Matte Black Frame + Platinum Border -->
    <rect x="2" y="2" width="104" height="68" rx="34" fill="#09090B" stroke="url(#platinumRim)" stroke-width="2.2" />
    <!-- Inner Hairline Graphite Border -->
    <rect x="8.5" y="8.5" width="91" height="55" rx="27.5" fill="none" stroke="#52525B" stroke-width="1" />

    <!-- Minimalist Side Accents -->
    <line x1="17" y1="36" x2="27" y2="36" stroke="#71717A" stroke-width="1.6" stroke-linecap="round" />
    <line x1="81" y1="36" x2="91" y2="36" stroke="#71717A" stroke-width="1.6" stroke-linecap="round" />

    <!-- Center Steering Wheel / Vinyl Ring -->
    <circle cx="54" cy="36" r="19.5" fill="none" stroke="url(#platinumBase)" stroke-width="2.6" />
    <circle cx="54" cy="36" r="14.2" fill="none" stroke="#71717A" stroke-width="0.8" stroke-dasharray="10 4" opacity="0.6" />

    <!-- 3-Spoke Classic Miata Steering Spokes -->
    <line x1="35.5" y1="36" x2="45" y2="36" stroke="#D4D4D8" stroke-width="2.4" stroke-linecap="round" />
    <line x1="63" y1="36" x2="72.5" y2="36" stroke="#D4D4D8" stroke-width="2.4" stroke-linecap="round" />
    <line x1="54" y1="45" x2="54" y2="54.5" stroke="#D4D4D8" stroke-width="2.4" stroke-linecap="round" />

    <!-- Central Coffee Bean Hub -->
    <g transform="translate(54, 36) rotate(-22)">
      <ellipse cx="0" cy="0" rx="6.5" ry="9.2" fill="#FAFAFA" stroke="#09090B" stroke-width="1.4" />
      <path d="M0 -7.5 C2.2 -2.8, -2.2 2.8, 0 7.5" fill="none" stroke="#09090B" stroke-width="1.7" stroke-linecap="round" />
    </g>
  </g>

  <!-- Modern Subtle Geometric Wordmark -->
  <text x="132" y="64" font-family="'Plus Jakarta Sans', 'Inter', 'SF Pro Display', system-ui, sans-serif" font-size="40" font-weight="600" letter-spacing="11" fill="url(#whiteSilver)">KLASIK</text>

  <!-- Brushed Platinum 3D Pill Badge -->
  <g transform="translate(364, 35)" filter="url(#platGlow)">
    <!-- Base Platinum Fill -->
    <rect width="58" height="28" rx="14" fill="url(#platinumBase)" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.75" />
    <!-- Brushed Metal Texture Overlay -->
    <rect width="58" height="28" rx="14" fill="url(#brushedLines)" />
    <!-- Crisp Top Specular Highlight -->
    <path d="M14 2 H44" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />
    <!-- Engraved Matte-Black Text -->
    <text x="29" y="19.5" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#09090B">3D</text>
  </g>

  <!-- Subtle Gray Sub-Label -->
  <text x="134" y="88" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="10.5" font-weight="500" letter-spacing="5.8" fill="#A1A1AA">GARAGE GARDEN CAFE</text>
</svg>
