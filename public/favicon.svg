<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#271a12" />
      <stop offset="100%" stop-color="#140d09" />
    </linearGradient>
    <radialGradient id="saucerGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="55%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#690d0d" />
    </radialGradient>
    <linearGradient id="cupBody" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="22%" stop-color="#dc2626" />
      <stop offset="68%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#580b0b" />
    </linearGradient>
    <linearGradient id="cupRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <radialGradient id="crema" cx="48%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="55%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#5c2808" />
    </radialGradient>
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <!-- Rounded espresso badge backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#7f1d1d" stroke-width="1.2" />

  <!-- Soft 3D drop shadow under saucer -->
  <ellipse cx="32" cy="52" rx="21" ry="5.5" fill="#090503" opacity="0.65" />

  <!-- 3D Red Ceramic Saucer -->
  <ellipse cx="31" cy="46.5" rx="21.5" ry="7.2" fill="#6b0f0f" />
  <ellipse cx="31" cy="45" rx="21.2" ry="6.8" fill="url(#saucerGrad)" />
  <ellipse cx="31" cy="44.8" rx="13.5" ry="4" fill="#7f1d1d" opacity="0.65" />

  <!-- 3D Cup Handle -->
  <path d="M44.5 31.5 C52.5 31.5, 53 41, 43.5 42" fill="none" stroke="#690d0d" stroke-width="4.4" stroke-linecap="round" />
  <path d="M44.5 31 C51.5 31, 52 40, 43.5 41.2" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" />
  <path d="M45.5 30.8 C49.5 31, 50.5 34.5, 48.8 37.5" fill="none" stroke="#fca5a5" stroke-width="0.9" stroke-linecap="round" opacity="0.7" />

  <!-- 3D Red Ceramic Cup Bowl -->
  <path d="M16 28.5 C16 42.5, 22.5 46.8, 31 46.8 C39.5 46.8, 46 42.5, 46 28.5 Z" fill="url(#cupBody)" />
  <!-- Glossy vertical 3D specular highlight on left curve -->
  <path d="M19.5 31.5 C19.5 39, 22 43, 25 44.5" fill="none" stroke="#fecaca" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />

  <!-- 3D Cup Top Rim -->
  <ellipse cx="31" cy="28.5" rx="15" ry="6.4" fill="url(#cupRim)" />
  <ellipse cx="31" cy="28.8" rx="13.2" ry="5" fill="#450a0a" />

  <!-- Rich Golden Espresso Crema & Latte Heart -->
  <ellipse cx="31" cy="29.3" rx="12.4" ry="4.4" fill="url(#crema)" />
  <path d="M31 32.1 C28.6 30.7, 27.6 29.5, 28.4 28.4 C29 27.6, 30.3 27.9, 31 28.8 C31.7 27.9, 33 27.6, 33.6 28.4 C34.4 29.5, 33.4 30.7, 31 32.1 Z" fill="#fef3c7" opacity="0.95" />

  <!-- Warm Rising 3D Steam Curl -->
  <path d="M29.5 26 C26.5 22, 33.5 18.5, 29.5 13.5 C27.5 11, 31 8.5, 32.5 7.5" fill="none" stroke="url(#steamGrad)" stroke-width="2.6" stroke-linecap="round" />
  <path d="M34.5 24.5 C32.5 21.5, 37.5 18.5, 34.5 14" fill="none" stroke="url(#steamGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
</svg>
