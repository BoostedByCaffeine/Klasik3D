name: Build Klasik 3D Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install web dependencies & build offline APK bundle
        env:
          VITE_APP_PLATFORM: apk
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx vite build --base=./

      - name: Generate Capacitor Android Project & Compile Landscape Fullscreen APK
        run: |
          npm install --save --legacy-peer-deps --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(p)) {
              let xml = fs.readFileSync(p, "utf8");
              xml = xml.replace(
                "android:name=\".MainActivity\"",
                "android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\" android:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode\""
              );
              if (!xml.includes("android.permission.VIBRATE")) {
                xml = xml.replace("<application", "    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <application");
              }
              fs.writeFileSync(p, xml);
            }
          '
          npx cap sync android
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          fi
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Klasik3D.apk

      - name: Upload Klasik3D.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klasik3D-Android-APK
          path: ./Klasik3D.apk
          if-no-files-found: error
