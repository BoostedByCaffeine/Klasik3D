name: Build Klasik 3D Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read App Version Metadata
        id: app_version
        run: |
          VERSION_NAME=$(node -e "console.log(require('./app-version.json').versionName)")
          VERSION_CODE=$(node -e "console.log(require('./app-version.json').versionCode)")
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building Klasik 3D v${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Install web dependencies & build offline APK bundle
        env:
          VITE_APP_PLATFORM: apk
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx vite build --base=./

      - name: Generate Capacitor Android Project & Compile Versioned Signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm install --save --legacy-peer-deps --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -rf android
          npx cap add android
          node scripts/patch-android-capacitor.mjs
          node scripts/generate-icons.mjs --android-res android/app/src/main/res
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('android/app/src/main/AndroidManifest.xml'); ET.parse('android/app/src/main/res/values/styles.xml'); ET.parse('android/app/src/main/res/values/ic_launcher_background.xml'); print('Android XML validation passed')"
          npx cap sync android
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          fi

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Decoding persistent release keystore for seamless in-place APK upgrades..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PWD/android/app/klasik3d-release.keystore"
            export ANDROID_KEYSTORE_PATH="$PWD/android/app/klasik3d-release.keystore"
            cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../Klasik3D.apk
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not configured — falling back to debug signing. Add keystore secrets so future APKs update without uninstalling."
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../Klasik3D.apk
          fi
          cp ../Klasik3D.apk "../Klasik3D-v${{ steps.app_version.outputs.version_name }}.apk"

      - name: Upload Klasik3D.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klasik3D-v${{ steps.app_version.outputs.version_name }}-b${{ steps.app_version.outputs.version_code }}-APK
          path: |
            ./Klasik3D.apk
            ./Klasik3D-v${{ steps.app_version.outputs.version_name }}.apk
          if-no-files-found: error
